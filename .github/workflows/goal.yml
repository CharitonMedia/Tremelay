name: goal

on:
  push:
    branches:
      - main
      - "goal/issue-*"
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      recovery_pr:
        description: PR number for GET-only review-worker reconciliation
        type: number
        required: true
      recovery_comment:
        description: Existing launch reservation comment ID; never creates a worker
        type: number
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ensure-label:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Ensure goal labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo
            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name })
              } catch (error) {
                if (error.status !== 404) throw error
                await github.rest.issues.createLabel({ owner, repo, name, color, description })
              }
            }
            await ensureLabel(
              "goal",
              "1D76DB",
              "Implement this issue with a Cursor cloud agent. The agent opens a pull request and does not merge.",
            )
            await ensureLabel(
              "goal-ready",
              "0E8A16",
              "Codex approved this goal pull request.",
            )
            await ensureLabel(
              "human-review-required",
              "B60205",
              "Automation stopped after the three-cycle remediation limit.",
            )

  implement:
    if: github.event_name == 'issues' && github.event.label.name == 'goal' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr list --state open --limit 100 --json number,url,body,labels,headRefName,baseRefName > open_prs.json
      - name: Build Cloud Agent request
        id: build
        run: |
          if python scripts/goal_agent_request.py build --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --open-prs open_prs.json --out payload.json; then
            echo "launch=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "launch=false" >> "$GITHUB_OUTPUT"
            else
              exit "$code"
            fi
          fi
      - name: Ensure goal branch
        id: ensure
        if: steps.build.outputs.launch == 'true'
        run: |
          set -euo pipefail
          base=$(python -c 'import sys; sys.path.insert(0, "scripts"); import goal_agent_request as g; print(g.DEFAULT_BASE_REF)')
          branch=$(python -c 'import json,sys; sys.path.insert(0, "scripts"); import goal_agent_request as g; print(g.branch_to_ensure(json.load(open("payload.json"))) or "")')
          if [ -z "$branch" ]; then
            exit 0
          fi
          git fetch origin "$base"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "branch exists"
          else
            git push origin "refs/remotes/origin/${base}:refs/heads/${branch}"
          fi
      - name: Launch Cloud Agent
        id: launch
        if: steps.build.outputs.launch == 'true' && steps.ensure.outcome == 'success'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GOAL_GITHUB_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/require_goal_github_token.sh
          number="${{ github.event.issue.number }}"
          if [ -z "${CURSOR_API_KEY}" ]; then
            gh issue comment "$number" --body "The \`goal\` label was applied, but this repository has no \`CURSOR_API_KEY\` secret. Create a key at Cursor Dashboard → API Keys, add it as a repository secret named \`CURSOR_API_KEY\`, and apply the label again."
            exit 1
          fi
          pr_url=$(python -c 'import json; print(json.load(open("payload.json"))["repos"][0].get("prUrl", ""))')
          if [ -n "$pr_url" ]; then
            pr_number=${pr_url##*/}
            before=$(gh pr view "$pr_number" --json headRefOid --jq .headRefOid)
            printf '%s\n' "$pr_number" > pr_number.txt
          else
            rm -f pr_number.txt
            base=$(python -c 'import sys; sys.path.insert(0, "scripts"); import goal_agent_request as g; print(g.DEFAULT_BASE_REF)')
            git fetch origin "$base"
            before=$(git rev-parse "origin/${base}")
          fi
          printf '%s\n' "$before" > before_sha.txt
          curl --fail-with-body -sS -u "${CURSOR_API_KEY}:" -H "Content-Type: application/json" --data @payload.json https://api.cursor.com/v1/agents > response.json
          url=$(python -c 'import json; print(json.load(open("response.json"))["agent"]["url"])')
          gh issue comment "$number" --body "A cloud agent is implementing this issue: ${url}. The workflow opens the pull request, with the Goal-Issue line and the goal label, after the branch has commits. The agent does not open one."
          python -c 'import json; print(json.load(open("response.json"))["agent"]["id"])' > agent_id.txt
          python -c 'import json; print(json.load(open("response.json"))["run"]["id"])' > run_id.txt
      - name: Open the pull request after the agent finishes
        if: steps.build.outputs.launch == 'true' && steps.launch.outcome == 'success'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GOAL_GITHUB_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/require_goal_github_token.sh
          status=$(bash scripts/wait_for_agent_run.sh "$(cat agent_id.txt)" "$(cat run_id.txt)")
          echo "agent run status: ${status}"
          before=$(tr -d '\n' < before_sha.txt)
          base=$(python -c 'import sys; sys.path.insert(0, "scripts"); import goal_agent_request as g; print(g.DEFAULT_BASE_REF)')
          issue="${{ github.event.issue.number }}"
          title=$(gh issue view "$issue" --json title --jq .title)
          if [ -f pr_number.txt ]; then
            pr_number=$(tr -d '\n' < pr_number.txt)
            gh pr view "$pr_number" --json number,url,body,labels,headRefName,baseRefName > existing.json
            python scripts/goal_agent_request.py apply-sync --issue-number "$issue" --title "$title" --existing existing.json --pr-number "$pr_number" --ahead
            after=$(gh pr view "$pr_number" --json headRefOid --jq .headRefOid)
            comment_target=$pr_number
          else
            branch=$(python -c 'import sys; sys.path.insert(0, "scripts"); import goal_agent_request as g; print(g.goal_branch(int(sys.argv[1])))' "$issue")
            git fetch origin "$base" "$branch"
            ahead=$(git rev-list --count "origin/${base}..origin/${branch}")
            gh pr list --head "$branch" --state open --json number,url,body,labels,headRefName,baseRefName > existing.json
            if [ "$ahead" -eq 0 ]; then
              python scripts/goal_agent_request.py apply-sync --issue-number "$issue" --title "$title" --existing existing.json --no-ahead
              after=$before
              comment_target=
            else
              comment_target=$(python scripts/goal_agent_request.py apply-sync --issue-number "$issue" --title "$title" --existing existing.json --ahead)
              if [ -z "$comment_target" ]; then
                comment_target=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
              fi
              after=$(git rev-parse "origin/${branch}")
            fi
          fi
          if [ "$status" != "FINISHED" ]; then
            body="Cursor agent stopped without producing a reviewable result. Terminal status: \`$status\`. No Codex rereview was requested; human review or explicit relaunch is required."
            if [ -n "$comment_target" ]; then
              gh pr comment "$comment_target" --body "$body"
            else
              gh issue comment "$issue" --body "$body"
            fi
            exit 0
          fi
          if [ "$before" = "$after" ]; then
            body="Cursor agent finished but did not move the goal branch from \`$before\`. No Codex rereview was requested; human review or explicit relaunch is required."
            if [ -n "$comment_target" ]; then
              gh pr comment "$comment_target" --body "$body"
            else
              gh issue comment "$issue" --body "$body"
            fi
            exit 0
          fi
          if [ -n "$comment_target" ] && comment=$(python scripts/goal_agent_request.py codex-rereview --status "$status" --before "$before" --after "$after"); then
            gh pr comment "$comment_target" --body "$comment"
          fi

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/goal/issue-')
    runs-on: ubuntu-latest
    concurrency:
      group: goal-publish-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for the rest of this push burst
        run: sleep 20
      - name: Sync pull request metadata
        env:
          GOAL_GITHUB_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="${{ github.ref_name }}"
          if ! issue=$(python -c 'import sys; sys.path.insert(0, "scripts"); import goal_agent_request as g; number = g.parse_goal_branch(sys.argv[1]); sys.exit(2) if number is None else print(number)' "$branch"); then
            echo "branch is not goal/issue-<number>"
            exit 0
          fi
          bash scripts/require_goal_github_token.sh
          base=$(python -c 'import sys; sys.path.insert(0, "scripts"); import goal_agent_request as g; print(g.DEFAULT_BASE_REF)')
          git fetch origin "$base" "$branch"
          ahead=$(git rev-list --count "origin/${base}..origin/${branch}")
          head=$(git rev-parse "origin/${branch}")
          title=$(gh issue view "$issue" --json title --jq .title)
          gh pr list --head "$branch" --state open --json number,url,body,labels,headRefName,baseRefName > existing.json
          changed="--head-changed"
          number=$(python -c 'import json,sys; sys.path.insert(0, "scripts"); import goal_agent_request as g; pulls=json.load(open("existing.json")); pr=g.select_open_pr(pulls, int(sys.argv[1])); print("" if pr is None else pr.get("number") or "")' "$issue")
          if [ -n "$number" ]; then
            gh api --paginate --slurp "repos/{owner}/{repo}/pulls/${number}/reviews" > reviews.json
            gh api --paginate --slurp "repos/{owner}/{repo}/issues/${number}/comments" > comments.json
            python -c 'import json,sys; sys.path.insert(0, "scripts"); import goal_agent_request as g; json.dump({"reviews": g.flatten_pages(json.load(open("reviews.json"))), "comments": g.flatten_pages(json.load(open("comments.json")))}, open("review_state.json", "w"))'
            if [ "$(python scripts/goal_agent_request.py head-already-reviewed --head "$head" --state review_state.json)" = "yes" ]; then
              changed="--head-accepted"
            fi
          fi
          if [ "$ahead" -eq 0 ]; then
            python scripts/goal_agent_request.py apply-sync --issue-number "$issue" --title "$title" --existing existing.json --no-ahead $changed
          else
            python scripts/goal_agent_request.py apply-sync --issue-number "$issue" --title "$title" --existing existing.json --ahead $changed
          fi

  codex-clean-complete:
    if: github.event_name == 'issue_comment' && (github.event.action == 'created' || github.event.action == 'edited') && github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read current pull request state
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr view "${{ github.event.issue.number }}" --json number,body,labels,headRefOid > clean_pr.json
      - name: Record clean Codex review
        env:
          GOAL_GITHUB_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if python scripts/complete_codex_clean_review.py --dry-run --event "$GITHUB_EVENT_PATH" --pull clean_pr.json; then
            bash scripts/require_goal_github_token.sh
            gh pr view "${{ github.event.issue.number }}" --json number,body,labels,headRefOid > clean_pr.json
            python scripts/complete_codex_clean_review.py --event "$GITHUB_EVENT_PATH" --pull clean_pr.json
          else
            code=$?
            if [ "$code" -eq 2 ]; then
              exit 0
            fi
            exit "$code"
          fi

  review-launch:
    if: "github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]' && !(contains(github.event.comment.body, 'Codex Review: Didn''t find any major issues.') && contains(github.event.comment.body, '**Reviewed commit:**')))"
    runs-on: ubuntu-latest
    concurrency:
      group: goal-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      launch: ${{ steps.claim.outputs.launch }}
      claim_id: ${{ steps.launch.outputs.claim_id }}
      agent_id: ${{ steps.launch.outputs.agent_id }}
      run_id: ${{ steps.launch.outputs.run_id }}
      before_sha: ${{ steps.launch.outputs.before_sha }}
      pr_number: ${{ steps.launch.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce remediation circuit breaker
        id: cycle
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > cycle_comments.json
          # cycle-budget always reports 3. A comment cannot raise that cap.
          read -r count max_cycles < <(python scripts/goal_agent_request.py cycle-budget --comments cycle_comments.json)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "max_cycles=${max_cycles}" >> "$GITHUB_OUTPUT"
          if [ "$count" -ge "$max_cycles" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            head=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
            marker="<!-- tremelay-cycle-stop head:${head} limit:${max_cycles} -->"
            existing=$(MARKER="$marker" python - <<'PY'
          import json, os
          pages=json.load(open("cycle_comments.json", encoding="utf-8"))
          comments=[c for page in pages for c in page]
          marker=os.environ["MARKER"]
          print("yes" if any(marker in (c.get("body") or "") for c in comments) else "no")
          PY
            )
            if [ "$existing" != "yes" ]; then
              gh label create human-review-required --repo "$GITHUB_REPOSITORY" --color B60205 --description "Automation stopped at the active remediation circuit breaker." --force
              gh pr edit "$PR_NUMBER" --add-label "human-review-required"
              python scripts/checkpoint_stop.py --head "$head" --comments cycle_comments.json --output checkpoint_stop.md
              gh pr comment "$PR_NUMBER" --body-file checkpoint_stop.md
            fi
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for the rest of this review
        if: steps.cycle.outputs.allowed == 'true'
        run: sleep 20
      - name: Build Cloud Agent request
        id: build
        if: steps.cycle.outputs.allowed == 'true'
        run: |
          if python scripts/goal_agent_request.py build --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --out payload.json; then
            echo "launch=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "launch=false" >> "$GITHUB_OUTPUT"
            else
              exit "$code"
            fi
          fi
      - name: Record Codex approval
        if: steps.cycle.outputs.allowed == 'true' && steps.build.outputs.launch != 'true'
        env:
          GOAL_GITHUB_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if python scripts/goal_agent_request.py complete --dry-run --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME"; then
            bash scripts/require_goal_github_token.sh
            python scripts/goal_agent_request.py complete --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" && exit 0
            code=$?
            if [ "$code" -eq 2 ]; then
              exit 0
            fi
            exit "$code"
          else
            code=$?
            if [ "$code" -eq 2 ]; then
              exit 0
            fi
            exit "$code"
          fi
      - name: Resolve trusted automation identity
        id: marker_identity
        if: steps.build.outputs.launch == 'true'
        env:
          GOAL_GITHUB_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GOAL_GITHUB_TOKEN:-}" ]; then
            echo "login=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          login=$(gh api user --jq .login)
          if [ -z "$login" ]; then
            echo "Could not resolve GOAL_GITHUB_TOKEN identity."
            exit 1
          fi
          echo "login=$login" >> "$GITHUB_OUTPUT"
      - name: Check review launch ownership
        id: claim
        if: steps.build.outputs.launch == 'true'
        env:
          GOAL_GITHUB_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number="${{ github.event.pull_request.number || github.event.issue.number }}"
          if [ -z "${GOAL_GITHUB_TOKEN:-}" ] || [ -z "${{ steps.marker_identity.outputs.login }}" ]; then
            echo "Approved automation identity is required."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" > live_pull.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${number}/reviews?per_page=100" > reviews.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${number}/comments?per_page=100" > comments.json
          python -c 'import json,sys; sys.path.insert(0, "scripts"); import goal_agent_request as g; json.dump({"pull": json.load(open("live_pull.json")), "reviews": g.flatten_pages(json.load(open("reviews.json"))), "comments": g.flatten_pages(json.load(open("comments.json")))}, open("ownership.json", "w"))'
          python scripts/goal_agent_request.py review-claim --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --state ownership.json --trusted-login "${{ steps.marker_identity.outputs.login }}" --out claim.json
          status=$(python -c 'import json; print(json.load(open("claim.json"))["status"])')
          if [ "$status" = "free" ]; then
            echo "launch=true" >> "$GITHUB_OUTPUT"
          else
            echo "launch=false" >> "$GITHUB_OUTPUT"
            echo "Not launching another worker for this review (status ${status})."
          fi
      - name: Launch Cloud Agent
        id: launch
        if: steps.claim.outputs.launch == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GOAL_GITHUB_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/require_goal_github_token.sh
          number="${{ github.event.pull_request.number || github.event.issue.number }}"
          if [ -z "${CURSOR_API_KEY}" ]; then
            gh pr comment "$number" --body "Review findings were not sent to a cloud agent because \`CURSOR_API_KEY\` is not set on this repository."
            exit 1
          fi
          stopped=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.labels[] | select(.name == "human-review-required") | .name')
          if [ -n "$stopped" ]; then
            echo "Checkpoint worker still owns this stopped PR; no review worker launch."
            exit 1
          fi
          before=$(gh pr view "$number" --json headRefOid --jq .headRefOid)
          expected=$(python -c 'import json; print(json.load(open("claim.json"))["head"])')
          if [ "$before" != "$expected" ]; then
            echo "Review head moved before launch; no stale worker launch."
            exit 1
          fi
          marker=$(python -c 'import json; print(json.load(open("claim.json"))["marker"])')
          if [ -z "$marker" ]; then
            echo "Refusing to launch without a stable review/head claim."
            exit 1
          fi
          claim_id=""
          accepted=false
          settled=false
          attempted=false
          # A released reservation is gone, or its body no longer owns the review.
          # 404 counts: a previous attempt already deleted the comment.
          claim_http() {
            local method=$1
            local payload=${2:-}
            local raw status
            if [ "$method" = "PATCH" ]; then
              raw=$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${claim_id}" -f body="$payload" --include 2>/dev/null || true)
            else
              raw=$(gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${claim_id}" --include 2>/dev/null || true)
            fi
            status=$(printf '%s\n' "$raw" | awk 'NR==1 { print $2; exit }')
            case "$status" in
              200|201|204|404) return 0 ;;
            esac
            return 1
          }
          release_claim() {
            local decision released attempt
            if [ -z "$claim_id" ]; then
              return 0
            fi
            decision=$(python scripts/goal_agent_request.py claim-release --accepted "$accepted" --settled "$settled" --attempted "$attempted")
            if [ "$decision" != "delete" ]; then
              return 0
            fi
            # Pre-create failures and definitive rejection did not start a worker.
            # If GitHub still has the comment, replace the body so it neither
            # owns the review nor counts as a cycle. A failed release stays failed.
            released=$(python scripts/goal_agent_request.py released-body)
            attempt=1
            while [ "$attempt" -le 3 ]; do
              if claim_http DELETE; then
                return 0
              fi
              if claim_http PATCH "$released"; then
                return 0
              fi
              sleep "$attempt"
              attempt=$((attempt + 1))
            done
            echo "Unstarted launch reservation ${claim_id} was not released." >&2
            return 1
          }
          trap release_claim EXIT
          trap 'exit 1' TERM INT
          python scripts/goal_review_launch.py prepare --repository "$GITHUB_REPOSITORY" --pr "$number" --claim claim.json --payload payload.json --state launch_state.json --body reservation_body.txt
          claim_body=$(cat reservation_body.txt)
          claim_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" -f body="$claim_body" --jq .id)
          if [ -z "$claim_id" ]; then
            echo "Launch reservation was not recorded."
            exit 1
          fi
          # Persist a stable identity before any potentially accepted create.
          # Local failures still release the claim until attempted becomes true.
          python scripts/goal_review_launch.py body --state launch_state.json --phase dispatch_reserved --body dispatch_body.txt
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${claim_id}" -f body="$(cat dispatch_body.txt)" >/dev/null
          # Recheck open/head/stop immediately before create, after the durable claim.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" > precreate_pull.json
          if ! python -c 'import json,sys; p=json.load(open("precreate_pull.json")); c=json.load(open("claim.json")); sys.exit(0 if p["state"]=="open" and p["head"]["sha"]==c["head"] and "human-review-required" not in {l["name"] for l in p["labels"]} else 1)'; then
            echo "PR closed, moved, or stopped before Cursor create; refusing launch."
            exit 1
          fi
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${number}/reviews?per_page=100" > precreate_reviews.json
          if ! python scripts/goal_agent_request.py review-current --claim claim.json --reviews precreate_reviews.json; then
            echo "Independent review changed or became clean before create; refusing launch."
            exit 1
          fi
          attempted=true
          set +e
          http_code=$(curl -sS -u "${CURSOR_API_KEY}:" -H "Content-Type: application/json" --data @payload.json -o response.json -w '%{http_code}' https://api.cursor.com/v1/agents)
          curl_status=$?
          set -e
          if [ "$curl_status" -ne 0 ]; then
            echo "Cursor create did not settle (curl ${curl_status}). Keeping claim ${claim_id}; use manual GET-only recovery for PR ${number} and this comment ID."
            exit 1
          fi
          outcome=$(python scripts/goal_agent_request.py create-outcome --http-code "$http_code")
          case "$outcome" in
            accept)
              settled=true
              accepted=true
              ;;
            reject)
              settled=true
              echo "Cursor rejected create with HTTP ${http_code}."
              exit 1
              ;;
            *)
              echo "Cursor create HTTP ${http_code} is ambiguous. Keeping claim ${claim_id}; use manual GET-only recovery for PR ${number} and this comment ID."
              exit 1
              ;;
          esac
          python scripts/goal_review_launch.py body --state launch_state.json --phase working --response response.json --body started_body.txt
          agent_id=$(python -c 'import json; print(json.load(open("launch_state.json"))["agent_id"])')
          run_id=$(python -c 'import json; print(json.load(open("launch_state.json"))["run_id"])')
          started_body=$(cat started_body.txt)
          # The reservation already counts. This PATCH records the agent URL in
          # that same comment. It must succeed before the job continues; a
          # failure leaves the counted claim in place and does not launch another worker.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${claim_id}" -f body="$started_body" >/dev/null
          echo "agent_id=${agent_id}" >> "$GITHUB_OUTPUT"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "before_sha=${before}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${number}" >> "$GITHUB_OUTPUT"
          echo "claim_id=${claim_id}" >> "$GITHUB_OUTPUT"

  recover-review:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: goal-review-${{ inputs.recovery_pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile an existing review worker without another create
        env:
          GOAL_GITHUB_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          RECOVERY_PR: ${{ inputs.recovery_pr }}
          RECOVERY_COMMENT: ${{ inputs.recovery_comment }}
        run: |
          set -euo pipefail
          bash scripts/require_goal_github_token.sh
          python scripts/goal_review_launch.py recover --repository "$GITHUB_REPOSITORY" --pr "$RECOVERY_PR" --comment "$RECOVERY_COMMENT"

  request-codex:
    needs: review-launch
    if: needs.review-launch.result == 'success' && needs.review-launch.outputs.launch == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: goal-review-${{ needs.review-launch.outputs.pr_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Request a fresh Codex review after new commits
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GOAL_GITHUB_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/require_goal_github_token.sh
          number="${{ needs.review-launch.outputs.pr_number }}"
          status=$(bash scripts/wait_for_agent_run.sh "${{ needs.review-launch.outputs.agent_id }}" "${{ needs.review-launch.outputs.run_id }}")
          echo "Worker observation: ${status}; reconciling the original recorded identity."
          python scripts/goal_review_launch.py recover --repository "$GITHUB_REPOSITORY" --pr "$number" --comment "${{ needs.review-launch.outputs.claim_id }}"
