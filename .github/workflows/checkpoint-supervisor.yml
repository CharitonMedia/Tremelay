name: Checkpoint Supervisor

on:
  workflow_run:
    workflows: [goal, CI, Test Linux, Test Windows]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Verify setup and Anthropic federation without a model call or restart
        type: boolean
        default: false
      model_smoke_only:
        description: One small billed Claude connection test; no worker launch
        type: boolean
        default: false
      recovery_pr:
        description: Optional PR for GET-only reconciliation of one existing supervisor worker
        type: string
        default: ''
      recovery_comment:
        description: Existing supervisor receipt comment ID; no model, launch, review, or label changes
        type: string
        default: ''

permissions:
  contents: read

# One controller owns checkpoint reservations across all event types. Never
# cancel a controller between accepting a model/dispatch and recording it.
concurrency:
  group: tremelay-checkpoint-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    # A backend change requires new owner activation. The former OpenAI opt-in
    # cannot enable Claude. Never mint production identity from another ref.
    if: ${{ github.ref == 'refs/heads/main' && github.workflow_ref == 'CharitonMedia/Tremelay/.github/workflows/checkpoint-supervisor.yml@refs/heads/main' && (vars.TREMELAY_SUPERVISOR_ACTIVATION == 'claude-wif-v2-5134b392b4a044deae9973b1c8757af2' || (github.event_name == 'workflow_dispatch' && (inputs.preflight_only == true || inputs.model_smoke_only == true))) }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: tremelay-worker-admission
      cancel-in-progress: false
      queue: max
    steps:
      # Every action in an OIDC-enabled job can request its identity token.
      # Keep first-party actions immutable; review a new full SHA before updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify supervisor controller tests
        run: python -m unittest discover -s automation_tests -p 'test_*.py'
      - name: Assess stopped goal PRs
        env:
          TREMELAY_WORKER_ADMISSION: serialized-v1
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          SUPERVISOR_MAX_CHECKPOINTS: '3'
          TREMELAY_SUPERVISOR_ACTIVATION: ${{ vars.TREMELAY_SUPERVISOR_ACTIVATION }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          MODEL_SMOKE_ONLY: ${{ inputs.model_smoke_only }}
          RECOVERY_PR: ${{ inputs.recovery_pr }}
          RECOVERY_COMMENT: ${{ inputs.recovery_comment }}
        run: |
          set -euo pipefail
          if [ -n "$RECOVERY_PR$RECOVERY_COMMENT" ]; then
            if [ "$PREFLIGHT_ONLY" = "true" ] || [ "$MODEL_SMOKE_ONLY" = "true" ] || ! [[ "$RECOVERY_PR" =~ ^[1-9][0-9]*$ && "$RECOVERY_COMMENT" =~ ^[1-9][0-9]*$ ]]; then
              echo 'Choose one recovery PR/comment pair without preflight or model smoke.' >&2
              exit 1
            fi
            python scripts/checkpoint_supervisor.py --recover-pr "$RECOVERY_PR" --recover-comment "$RECOVERY_COMMENT"
            exit 0
          fi
          if [ "$PREFLIGHT_ONLY" = "true" ] && [ "$MODEL_SMOKE_ONLY" = "true" ]; then
            echo 'Choose either authentication preflight or the model smoke test.' >&2
            exit 1
          fi
          if [ "$PREFLIGHT_ONLY" = "true" ]; then
            python scripts/checkpoint_supervisor.py --preflight
          elif [ "$MODEL_SMOKE_ONLY" = "true" ]; then
            python scripts/checkpoint_supervisor.py --model-smoke
          else
            python scripts/checkpoint_supervisor.py
          fi
