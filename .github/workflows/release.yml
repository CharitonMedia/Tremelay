name: Release artifacts (dry run)

# Builds the six release artifacts, their SBOMs and checksums, and uploads them
# as workflow artifacts only. This workflow MUST NOT create or publish a GitHub
# Release, upload release assets, sign anything, or push to the repository:
# publishing is V1 item 9 and owner-gated. `contents: read` keeps that true.
# See docs/adr/0027-release-artifacts.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.26.9

jobs:
  artifacts:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.9'
          check-latest: false
      - name: Build binaries, archives, SBOMs and checksums
        env:
          TREMELAY_VERSION: ${{ github.ref_name }}
        run: make release-dry
      - run: ls -l dist/release && cat dist/release/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tremelay-${{ github.ref_name }}-artifacts
          path: dist/release
          if-no-files-found: error
