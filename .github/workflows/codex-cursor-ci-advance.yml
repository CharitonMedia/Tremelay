name: Codex Cursor CI Advance

on:
  workflow_run:
    workflows: ["Test Linux", "Test Windows"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-cursor-ci-advance-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  advance:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Find opted-in PR for exact head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${owner}:${HEAD_BRANCH}&per_page=100" > prs.json
          python - <<'PY'
          import json, os
          prs = json.load(open("prs.json", encoding="utf-8"))
          head = os.environ["HEAD_SHA"]
          matches = [p for p in prs if p.get("head", {}).get("sha") == head]
          if len(matches) > 1:
              raise SystemExit("multiple open PRs match exact head")
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              if not matches:
                  fh.write("found=false\n")
              else:
                  fh.write("found=true\n")
                  fh.write(f"number={matches[0]['number']}\n")
          PY

      - name: Verify live opt-in and exact head
        id: eligible
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > pull.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}" > issue.json
          python - <<'PY'
          import json, os
          pull = json.load(open("pull.json", encoding="utf-8"))
          issue = json.load(open("issue.json", encoding="utf-8"))
          labels = {x["name"] for x in issue.get("labels", []) if isinstance(x, dict) and "name" in x}
          eligible = (
              pull.get("state") == "open"
              and pull.get("head", {}).get("sha") == os.environ["HEAD_SHA"]
              and "codex-cursor-loop" in labels
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"eligible={'true' if eligible else 'false'}\n")
          PY

      - name: Verify exact-head Linux and Windows CI
        id: ci
        if: steps.eligible.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" > runs.json
          python - <<'PY'
          import json, os
          runs = json.load(open("runs.json", encoding="utf-8")).get("workflow_runs", [])
          head = os.environ["HEAD_SHA"]
          relevant = [
              r for r in runs
              if r.get("head_sha") == head
              and r.get("name") in {"Test Linux", "Test Windows"}
              and r.get("event") in {"push", "pull_request"}
          ]
          latest = {}
          for run in relevant:
              key = (run.get("name"), run.get("event"))
              prior = latest.get(key)
              if prior is None or int(run.get("id", 0)) > int(prior.get("id", 0)):
                  latest[key] = run

          by_name = {"Test Linux": [], "Test Windows": []}
          for (name, event), run in latest.items():
              by_name[name].append((event, run.get("status"), run.get("conclusion"), run.get("id")))

          ready = all(
              by_name[name]
              and all(status == "completed" and conclusion == "success" for _, status, conclusion, _ in by_name[name])
              for name in by_name
          )
          print(f"Latest exact-head CI: {by_name}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"ready={'true' if ready else 'false'}\n")
          PY

      - name: Resolve Codex-request identity
        id: identity
        if: steps.ci.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "GOAL_GITHUB_TOKEN is not set."
            exit 1
          fi
          login=$(gh api user --jq .login)
          if [ -z "$login" ]; then
            echo "Could not resolve GOAL_GITHUB_TOKEN identity."
            exit 1
          fi
          echo "login=$login" >> "$GITHUB_OUTPUT"

      - name: Check rereview idempotency
        id: dedupe
        if: steps.ci.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > comments.json
          TRUSTED_LOGIN="${{ steps.identity.outputs.login }}" python - <<'PY'
          import json, os
          pages = json.load(open("comments.json", encoding="utf-8"))
          comments = [c for page in pages for c in page]
          marker = f"<!-- codex-cursor-rereview head:{os.environ['HEAD_SHA']} -->"
          trusted = os.environ["TRUSTED_LOGIN"].casefold()
          exists = any(
              marker in (c.get("body") or "")
              and ((c.get("user") or {}).get("login") or "").casefold() == trusted
              for c in comments
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"exists={'true' if exists else 'false'}\n")
          PY

      - name: Request exact-head Codex rereview
        if: steps.ci.outputs.ready == 'true' && steps.dedupe.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "GOAL_GITHUB_TOKEN is not set."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > live_pull.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}" > live_issue.json
          live_head=$(python -c 'import json; print(json.load(open("live_pull.json"))["head"]["sha"])')
          live_state=$(python -c 'import json; print(json.load(open("live_pull.json"))["state"])')
          has_label=$(python -c 'import json; i=json.load(open("live_issue.json")); print("true" if "codex-cursor-loop" in {x["name"] for x in i.get("labels", [])} else "false")')
          if [ "$live_state" != "open" ] || [ "$live_head" != "$HEAD_SHA" ] || [ "$has_label" != "true" ]; then
            echo "PR is no longer open, opted in, and bound to the tested exact head; refusing rereview."
            exit 0
          fi

          # Refresh the Actions snapshot immediately before consuming another
          # Codex review. A rerun or newly-started duplicate run must not be
          # hidden by an earlier successful run for the same SHA.
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" > final_runs.json
          final_ready=$(python - <<'PY'
          import json, os
          runs = json.load(open("final_runs.json", encoding="utf-8")).get("workflow_runs", [])
          head = os.environ["HEAD_SHA"]
          relevant = [
              r for r in runs
              if r.get("head_sha") == head
              and r.get("name") in {"Test Linux", "Test Windows"}
              and r.get("event") in {"push", "pull_request"}
          ]
          latest = {}
          for run in relevant:
              key = (run.get("name"), run.get("event"))
              prior = latest.get(key)
              if prior is None or int(run.get("id", 0)) > int(prior.get("id", 0)):
                  latest[key] = run
          by_name = {"Test Linux": [], "Test Windows": []}
          for (name, event), run in latest.items():
              by_name[name].append((event, run.get("status"), run.get("conclusion"), run.get("id")))
          ready = all(
              by_name[name]
              and all(status == "completed" and conclusion == "success" for _, status, conclusion, _ in by_name[name])
              for name in by_name
          )
          print("true" if ready else "false")
          PY
          )
          if [ "$final_ready" != "true" ]; then
            echo "Exact-head CI is no longer fully green; a later workflow_run event will retry the transition."
            exit 0
          fi

          marker="<!-- codex-cursor-rereview head:${HEAD_SHA} -->"
          body=$(printf '@codex review\n\nExact-head Linux and Windows CI passed for %s. Continue the automated remediation loop. Do not merge or release.\n\n%s' "$HEAD_SHA" "$marker")
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body"
