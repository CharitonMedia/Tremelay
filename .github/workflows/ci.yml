name: CI

on:
  push:
  pull_request:
  # A quiet branch stays green while new advisories land against its pinned
  # toolchain and modules, so the default branch is re-checked every Monday.
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.26.11

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.11'
      # internal/vault can take ~10m on windows-latest; the default is 10m.
      - run: go test -timeout 20m ./...
      - run: go vet ./...
      - run: cd tools && go test ./...
      - run: cd tools && go vet ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.11'
      - run: go test -race ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.11'
      - name: Install pinned govulncheck
        working-directory: tools
        run: go install -mod=readonly golang.org/x/vuln/cmd/govulncheck
      - run: govulncheck ./...

  candidate:
    name: Linux candidate evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.11'
          check-latest: false
      - name: Reproducible unsigned Linux CLI evidence
        run: make candidate

  ponytail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify pinned Ponytail rule
        run: python3 scripts/verify_ponytail.py
