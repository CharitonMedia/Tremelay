name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.26.9

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - run: go test ./...
      - run: go vet ./...
      - run: cd tools && go test ./...
      - run: cd tools && go vet ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - run: go test -race ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - name: Install pinned govulncheck
        working-directory: tools
        run: go install -mod=readonly golang.org/x/vuln/cmd/govulncheck
      - run: govulncheck ./...

  candidate:
    name: Linux candidate evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.9'
          check-latest: false
      - name: Reproducible unsigned Linux CLI evidence
        run: make candidate

  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Ponytail rule
        run: python3 scripts/verify_ponytail.py
      - name: Compile automation helpers
        run: python3 -m py_compile scripts/*.py
      - name: Test review ownership and fixed cycle budget
        run: python3 scripts/goal_agent_request.py self-check
      - name: Test automatic checkpoint supervisor
        run: python3 -m unittest discover -s automation_tests -p 'test_*.py'
