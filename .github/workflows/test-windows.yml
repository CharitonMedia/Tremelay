name: Test Windows

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.26.9

jobs:
  test:
    name: Windows core suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - name: Verify required Cursor rule
        run: python scripts/verify_ponytail.py
      - name: Prepare official Windows GUI helper
        shell: pwsh
        run: ./scripts/prepare_windows_pinentry.ps1
      - name: Build shipping CLI for GUI custody fixture
        shell: pwsh
        run: |
          go build -o "$env:TREMELAY_TEST_WINDOWS_CLI" ./cmd/tremelay
          if ($LASTEXITCODE -ne 0) { throw 'Shipping CLI build failed.' }
      - name: Provision exact Windows named-client Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.8'
          architecture: 'x64'
      - name: Prepare pinned native named clients
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/prepare_windows_named_clients.ps1
      - name: Native named-client credential operation compatibility
        shell: pwsh
        timeout-minutes: 15
        run: |
          go test -c ./cmd/tremelay -o "$env:TREMELAY_TEST_WINDOWS_NAMED_TEST"
          if ($LASTEXITCODE -ne 0) { throw 'Native custody test binary compilation failed.' }
          $env:TREMELAY_TEST_WINDOWS_NAMED_REQUIRED = '1'
          foreach ($client in @('codex', 'claude', 'hermes')) {
            $env:TREMELAY_TEST_WINDOWS_NAMED_CLIENT = $client
            $env:TREMELAY_TEST_WINDOWS_NATIVE = switch ($client) {
              codex { $env:TREMELAY_TEST_WINDOWS_CODEX }
              claude { $env:TREMELAY_TEST_WINDOWS_CLAUDE }
              hermes { $env:TREMELAY_TEST_WINDOWS_HERMES_PYTHON }
            }
            $env:TREMELAY_TEST_WINDOWS_NAMED_EVIDENCE = Join-Path $env:TREMELAY_TEST_WINDOWS_NAMED_RESULTS "$client-operation.json"
            & $env:TREMELAY_TEST_WINDOWS_NAMED_TEST '-test.run=^TestWindowsNamedClientCredentialOperation$' '-test.count=1' '-test.timeout=4m'
            if ($LASTEXITCODE -ne 0) { throw "Native $client custody acceptance failed." }
            if (-not (Test-Path -LiteralPath $env:TREMELAY_TEST_WINDOWS_NAMED_EVIDENCE -PathType Leaf)) {
              throw 'Native custody evidence receipt is missing.'
            }
          }
      # The ordinary suite below also runs these. This step additionally names
      # them, because a build tag that silently excluded the Windows daemon
      # tests would leave `go test ./...` green with nothing exercised.
      - name: Daemon over a Windows named pipe
        shell: pwsh
        timeout-minutes: 10
        run: |
          $log = go test -v -count=1 -run '^(TestDaemon|TestAgentTokenFile|TestSSHAgentFailsClosedOnWindows)' ./cmd/tremelay 2>&1 | Out-String
          Write-Output $log
          if ($LASTEXITCODE -ne 0) { throw 'Windows daemon suite failed.' }
          foreach ($name in @(
            'TestDaemonUnlockedAgentCall',
            'TestDaemonConcurrentAgentsStayIsolated',
            'TestDaemonIdleTimeoutFailsClosed',
            'TestDaemonReloadsOnControlPlaneChange',
            'TestDaemonLocksOnUnverifiableVault',
            'TestDaemonAgentTokenCustody',
            'TestDaemonPipeDescriptorIsOwnerOnly',
            'TestDaemonPipeNameIsClaimedExclusively',
            'TestDaemonPipeNameRejectsUnsafeInstance',
            'TestAgentTokenFileRefusesWiderDACL',
            'TestSSHAgentFailsClosedOnWindows')) {
            if ($log -notmatch "--- PASS: $name\b") { throw "$name did not run on windows-latest." }
          }
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Test build-evidence verifier
        run: cd tools && go test ./...
      - name: Vet build-evidence verifier
        run: cd tools && go vet ./...
      - name: Retain allowlisted native custody receipts
        uses: actions/upload-artifact@v4
        with:
          name: windows-named-client-custody-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ env.TREMELAY_TEST_WINDOWS_NAMED_RESULTS }}/preparation.json
            ${{ env.TREMELAY_TEST_WINDOWS_NAMED_RESULTS }}/codex-operation.json
            ${{ env.TREMELAY_TEST_WINDOWS_NAMED_RESULTS }}/claude-operation.json
            ${{ env.TREMELAY_TEST_WINDOWS_NAMED_RESULTS }}/hermes-operation.json
