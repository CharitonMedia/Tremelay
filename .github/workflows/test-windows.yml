name: Test Windows

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.26.9

jobs:
  test:
    name: Windows core suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - name: Verify required Cursor rule
        run: python scripts/verify_ponytail.py
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Test build-evidence verifier
        run: cd tools && go test ./...
      - name: Vet build-evidence verifier
        run: cd tools && go vet ./...
