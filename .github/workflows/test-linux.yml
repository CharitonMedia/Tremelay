name: Test Linux

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.26.9

jobs:
  test:
    name: Linux core suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.9'
      - name: Verify required Cursor rule
        run: python3 scripts/verify_ponytail.py
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Test build-evidence verifier
        run: cd tools && go test ./...
      - name: Vet build-evidence verifier
        run: cd tools && go vet ./...
