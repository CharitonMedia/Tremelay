name: Supervisor Setup Check

on:
  pull_request:
    paths:
      - '.github/workflows/checkpoint-supervisor.yml'
      - '.github/workflows/supervisor-preflight.yml'
      - 'scripts/checkpoint_supervisor.py'
      - 'automation_tests/test_checkpoint_supervisor.py'

permissions:
  contents: read

jobs:
  check:
    # Same-repository PRs only. Never check out or execute PR code with keys.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check repository secret presence without reading values
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOAL_GITHUB_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=false
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'Missing OPENAI_API_KEY repository secret.'
            missing=true
          fi
          if [ -z "$GOAL_GITHUB_TOKEN" ]; then
            echo 'Missing GOAL_GITHUB_TOKEN repository secret.'
            missing=true
          fi
          if [ "$missing" = true ]; then exit 1; fi
          echo 'Required secret names are present. No values printed and no API call made.'
