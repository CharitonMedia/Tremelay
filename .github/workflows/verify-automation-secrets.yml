name: Verify Automation Secrets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets are present
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GOAL_GITHUB_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "CURSOR_API_KEY is missing"
            exit 1
          fi
          if [ -z "$GOAL_GITHUB_TOKEN" ]; then
            echo "GOAL_GITHUB_TOKEN is missing"
            exit 1
          fi
          echo "Required automation secrets are present."
