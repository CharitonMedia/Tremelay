name: Codex Cursor Remediation

on:
  push:
    branches: [main]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

# Hold this event's coalescing slot through downstream global admission and
# completion. Distinct reviews/heads and approvals cannot replace each other.
# Non-review or ineligible events get a unique group, including manual recovery.
concurrency:
  group: "${{ (github.repository == 'CharitonMedia/Tremelay' && ((github.event_name == 'pull_request_review' && github.event.action == 'submitted' && (github.event.review.user.login == 'codex' || github.event.review.user.login == 'chatgpt-codex-connector[bot]') && github.event.review.id && github.event.review.commit_id == github.event.pull_request.head.sha && (github.event.review.state == 'commented' || github.event.review.state == 'changes_requested')) || (github.event_name == 'pull_request_review_comment' && github.event.action == 'created' && (github.event.comment.user.login == 'codex' || github.event.comment.user.login == 'chatgpt-codex-connector[bot]') && github.event.comment.id && github.event.comment.pull_request_review_id && github.event.comment.body != '' && github.event.comment.commit_id == github.event.pull_request.head.sha)) && github.event.pull_request.state == 'open' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'human-review-required') && contains(github.event.pull_request.labels.*.name, 'codex-cursor-loop') && !contains(github.event.pull_request.labels.*.name, 'goal')) && format('tremelay-generic-review-{0}-{1}-{2}-{3}', github.event.pull_request.number || github.event.issue.number, github.event.review.state == 'approved' && 'approval' || 'remediation', github.event.review.id || github.event.comment.pull_request_review_id || format('summary-{0}', github.event.comment.id), github.event.review.commit_id || github.event.comment.commit_id || 'summary') || format('tremelay-generic-run-{0}', github.run_id) }}"
  cancel-in-progress: false
  queue: single

jobs:
  ensure-label:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure opt-in label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create codex-cursor-loop --repo "$GITHUB_REPOSITORY" --color 1D76DB --description "Automatically send Codex findings to Cursor; never auto-merge." --force

  review-preflight:
    if: "github.repository == 'CharitonMedia/Tremelay' && ((github.event_name == 'pull_request_review' && github.event.action == 'submitted' && (github.event.review.user.login == 'codex' || github.event.review.user.login == 'chatgpt-codex-connector[bot]') && github.event.review.id && github.event.review.commit_id == github.event.pull_request.head.sha && (github.event.review.state == 'commented' || github.event.review.state == 'changes_requested')) || (github.event_name == 'pull_request_review_comment' && github.event.action == 'created' && (github.event.comment.user.login == 'codex' || github.event.comment.user.login == 'chatgpt-codex-connector[bot]') && github.event.comment.id && github.event.comment.pull_request_review_id && github.event.comment.body != '' && github.event.comment.commit_id == github.event.pull_request.head.sha)) && github.event.pull_request.state == 'open' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'human-review-required') && contains(github.event.pull_request.labels.*.name, 'codex-cursor-loop') && !contains(github.event.pull_request.labels.*.name, 'goal')"
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.admission.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Settle and authenticate current review without worker admission
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/review_admission.py --mode generic --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --out preflight_event.json --settle

  remediate:
    # A human reply on a Codex thread keeps the parent review id. Admit comment
    # events only for the trusted Codex logins so a skipped identity step cannot
    # normalize that parent review and post a false automation-stopped comment.
    needs: review-preflight
    if: needs.review-preflight.outputs.allowed == 'true'
    concurrency:
      group: tremelay-worker-admission
      cancel-in-progress: false
      queue: max
    env:
      TREMELAY_WORKER_ADMISSION: serialized-v1
    runs-on: ubuntu-latest
    steps:
      - name: Check out automation from main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recheck review admission before writes
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/review_admission.py --mode generic --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --out admitted_event.json
      - name: Resolve trusted automation identity
        id: marker_identity
        if: steps.admission.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "GOAL_GITHUB_TOKEN is not set."
            exit 1
          fi
          login=$(gh api user --jq .login)
          if [ -z "$login" ]; then
            echo "Could not resolve GOAL_GITHUB_TOKEN identity."
            exit 1
          fi
          echo "login=$login" >> "$GITHUB_OUTPUT"

      - name: Reconcile existing generic worker receipts
        if: steps.marker_identity.outputs.login != ''
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python scripts/generic_worker.py reconcile --pr "$PR_NUMBER"

      - name: Read live pull request and Codex review
        if: steps.admission.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id || github.event.comment.pull_request_review_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}" > review.json
          gh pr view "$PR_NUMBER" --json number,url,headRefOid,headRefName,baseRefName,labels > pull.json
          python - <<'PY'
          import json
          review = json.load(open("review.json", encoding="utf-8"))
          json.dump({"action": "submitted", "review": review}, open("normalized_event.json", "w", encoding="utf-8"))
          PY
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}/comments?per_page=100" > review_comments.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > issue_comments.json

      - name: Build exact-head remediation plan
        id: plan
        if: steps.admission.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          # Three cycles per segment. A comment cannot raise this.
          max_rounds=3
          python scripts/codex_cursor_remediation.py build --event normalized_event.json --pull pull.json --review-comments review_comments.json --issue-comments issue_comments.json --out plan.json --max-rounds "$max_rounds" --repo-url "https://github.com/${GITHUB_REPOSITORY}" --trusted-marker-login "${{ steps.marker_identity.outputs.login }}"
          action=$(python -c 'import json; print(json.load(open("plan.json"))["action"])')
          reason=$(python -c 'import json; print(json.load(open("plan.json")).get("reason", ""))')
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "max_rounds=$max_rounds" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<EOF"
            echo "$reason"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report circuit-breaker or stale-head stop
        if: steps.plan.outputs.action == 'stop'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          set -euo pipefail
          LIMIT="${{ steps.plan.outputs.max_rounds }}"
          if [[ "$REASON" == *"circuit breaker reached ${LIMIT} rounds"* ]]; then
            gh label create human-review-required --repo "$GITHUB_REPOSITORY" --color B60205 --description "Automation stopped at the active remediation circuit breaker." --force
            gh pr edit "$PR_NUMBER" --add-label human-review-required
            gh pr comment "$PR_NUMBER" --body "Codex-to-Cursor automation stopped after ${LIMIT} remediation cycles. A documented supervisor assessment is required before another agent run. The implementation worker must not authorize its own further cycles. Reason: ${REASON}"
          else
            gh pr comment "$PR_NUMBER" --body "Codex-to-Cursor automation stopped: ${REASON}"
          fi

      - name: Require Cursor and owner GitHub credentials
        if: steps.plan.outputs.action == 'launch'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GOAL_GITHUB_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "CURSOR_API_KEY is not set."
            exit 1
          fi
          if [ -z "$GOAL_GITHUB_TOKEN" ]; then
            echo "GOAL_GITHUB_TOKEN is not set. Codex does not act on review requests posted by github-actions[bot]."
            exit 1
          fi
          if [ -z "${{ steps.marker_identity.outputs.login }}" ]; then
            echo "Trusted automation identity was not resolved."
            exit 1
          fi

      - name: Claim review and launch Cursor Cloud Agent
        id: cursor
        if: steps.plan.outputs.action == 'launch'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/generic_worker.py launch --plan plan.json

      - name: Wait for Cursor remediation
        id: wait_cursor
        if: steps.plan.outputs.action == 'launch' && steps.cursor.outcome == 'success'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          status=$(bash scripts/wait_for_cursor_agent.sh "$(cat agent_id.txt)" "$(cat run_id.txt)")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Cursor status: $status"

      - name: Verify and persist generic worker terminal ownership
        if: always() && steps.marker_identity.outputs.login != '' && steps.plan.outputs.action == 'launch'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python scripts/generic_worker.py reconcile --pr "$PR_NUMBER"

      - name: Stop if Cursor did not finish
        if: steps.plan.outputs.action == 'launch' && steps.wait_cursor.outputs.status != 'FINISHED'
        env:
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATUS: ${{ steps.wait_cursor.outputs.status }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Codex-to-Cursor automation stopped because the Cursor run ended with status ${STATUS}."
          exit 1

      - name: Verify Cursor moved only this pull request forward
        id: moved
        if: steps.plan.outputs.action == 'launch' && steps.wait_cursor.outputs.status == 'FINISHED'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          before=$(python -c 'import json; print(json.load(open("plan.json"))["head_sha"])')
          after=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          relation=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${before}...${after}" --jq .status)
          if [ "$relation" != "ahead" ]; then
            echo "Expected new head to descend from reviewed head; compare status was $relation."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Stop if Cursor made no commit
        if: steps.plan.outputs.action == 'launch' && steps.moved.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Codex-to-Cursor automation stopped because Cursor finished without moving the pull-request head."
          exit 1

