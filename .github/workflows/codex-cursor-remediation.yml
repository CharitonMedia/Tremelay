name: Codex Cursor Remediation

on:
  push:
    branches: [main]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  ensure-label:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure opt-in label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create codex-cursor-loop --repo "$GITHUB_REPOSITORY" --color 1D76DB --description "Automatically send Codex findings to Cursor; never auto-merge." --force

  remediate:
    # A human reply on a Codex thread keeps the parent review id. Admit comment
    # events only for the trusted Codex logins so a skipped identity step cannot
    # normalize that parent review and post a false automation-stopped comment.
    if: "github.event.pull_request.state == 'open' && (github.event_name == 'pull_request_review' || (github.event_name == 'pull_request_review_comment' && (github.event.comment.user.login == 'codex' || github.event.comment.user.login == 'chatgpt-codex-connector[bot]')))"
    concurrency:
      group: codex-cursor-remediation-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out automation from main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve trusted automation identity
        id: marker_identity
        if: github.event.review.user.login == 'codex' || github.event.review.user.login == 'chatgpt-codex-connector[bot]' || github.event.comment.user.login == 'codex' || github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
        env:
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "GOAL_GITHUB_TOKEN is not set."
            exit 1
          fi
          login=$(gh api user --jq .login)
          if [ -z "$login" ]; then
            echo "Could not resolve GOAL_GITHUB_TOKEN identity."
            exit 1
          fi
          echo "login=$login" >> "$GITHUB_OUTPUT"

      - name: Read live pull request and Codex review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id || github.event.comment.pull_request_review_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}" > review.json 2>review_fetch_error.txt; then
              state=$(python -c 'import json; print(str(json.load(open("review.json")).get("state", "")).upper())')
              if [ "$state" != "PENDING" ]; then
                break
              fi
            else
              state="PENDING"
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Codex review $REVIEW_ID remained pending or inaccessible for five minutes."
              cat review_fetch_error.txt || true
              exit 1
            fi
            sleep 5
          done
          gh pr view "$PR_NUMBER" --json number,url,headRefOid,headRefName,baseRefName,labels > pull.json
          python - <<'PY'
          import json
          review = json.load(open("review.json", encoding="utf-8"))
          json.dump({"action": "submitted", "review": review}, open("normalized_event.json", "w", encoding="utf-8"))
          PY
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}/comments?per_page=100" > review_comments.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > issue_comments.json

      - name: Build exact-head remediation plan
        id: plan
        run: |
          set -euo pipefail
          max_rounds=$(python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          pages=json.load(open("issue_comments.json", encoding="utf-8"))
          comments=[c for page in pages for c in page]
          marker="<!-- tremelay-unattended-window hours:6 max-cycles:9 -->"
          now=datetime.now(timezone.utc)
          limit=3
          for c in comments:
              if (c.get("user") or {}).get("login","").casefold()!="pattalkslaw-del":
                  continue
              if marker not in (c.get("body") or ""):
                  continue
              raw=c.get("created_at") or ""
              try:
                  created=datetime.fromisoformat(raw.replace("Z","+00:00"))
              except ValueError:
                  continue
              if created <= now < created + timedelta(hours=6):
                  limit=9
          print(limit)
          PY
          )
          python scripts/codex_cursor_remediation.py build --event normalized_event.json --pull pull.json --review-comments review_comments.json --issue-comments issue_comments.json --out plan.json --max-rounds "$max_rounds" --repo-url "https://github.com/${GITHUB_REPOSITORY}" --trusted-marker-login "${{ steps.marker_identity.outputs.login }}"
          action=$(python -c 'import json; print(json.load(open("plan.json"))["action"])')
          reason=$(python -c 'import json; print(json.load(open("plan.json")).get("reason", ""))')
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "max_rounds=$max_rounds" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<EOF"
            echo "$reason"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report circuit-breaker or stale-head stop
        if: steps.plan.outputs.action == 'stop'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          set -euo pipefail
          LIMIT="${{ steps.plan.outputs.max_rounds }}"
          if [[ "$REASON" == *"circuit breaker reached ${LIMIT} rounds"* ]]; then
            gh label create human-review-required --repo "$GITHUB_REPOSITORY" --color B60205 --description "Automation stopped at the active remediation circuit breaker." --force
            gh pr edit "$PR_NUMBER" --add-label human-review-required
            gh pr comment "$PR_NUMBER" --body "Codex-to-Cursor automation stopped after ${LIMIT} remediation cycles. A documented supervisor assessment is required before another agent run. The implementation worker must not authorize its own further cycles. Reason: ${REASON}"
          else
            gh pr comment "$PR_NUMBER" --body "Codex-to-Cursor automation stopped: ${REASON}"
          fi

      - name: Require Cursor and owner GitHub credentials
        if: steps.plan.outputs.action == 'launch'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GOAL_GITHUB_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "CURSOR_API_KEY is not set."
            exit 1
          fi
          if [ -z "$GOAL_GITHUB_TOKEN" ]; then
            echo "GOAL_GITHUB_TOKEN is not set. Codex does not act on review requests posted by github-actions[bot]."
            exit 1
          fi
          if [ -z "${{ steps.marker_identity.outputs.login }}" ]; then
            echo "Trusted automation identity was not resolved."
            exit 1
          fi

      - name: Claim review and launch Cursor Cloud Agent
        id: cursor
        if: steps.plan.outputs.action == 'launch'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GOAL_GITHUB_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          planned_head=$(python -c 'import json; print(json.load(open("plan.json"))["head_sha"])')
          live_head=$(GH_TOKEN="$GOAL_GITHUB_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)
          live_state=$(GH_TOKEN="$GOAL_GITHUB_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .state)
          has_label=$(GH_TOKEN="$GOAL_GITHUB_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}" --jq '[.labels[].name] | index("codex-cursor-loop") != null')
          if [ "$live_state" != "open" ] || [ "$live_head" != "$planned_head" ] || [ "$has_label" != "true" ]; then
            echo "Live PR is no longer eligible for this exact-head remediation."
            exit 1
          fi

          marker=$(python -c 'import json; print(json.load(open("plan.json"))["marker"])')
          review_id=$(python -c 'import json; print(json.load(open("plan.json"))["review_id"])')
          round=$(python -c 'import json; print(json.load(open("plan.json"))["round"])')
          findings=$(python -c 'import json; print(json.load(open("plan.json"))["findings"])')
          python -c 'import json; p=json.load(open("plan.json")); json.dump(p["payload"], open("payload.json","w"))'
          agent_id=$(python -c 'import json; print(json.load(open("payload.json"))["agentId"])')
          claim_marker="<!-- codex-cursor-claim review:${review_id} head:${planned_head} -->"

          # A pending claim is deliberately different from the completed
          # remediation marker. If a prior run ended ambiguously, reuse the
          # trusted claim and reconcile the same deterministic Cursor agent id.
          claim_id=$(CLAIM_MARKER="$claim_marker" TRUSTED_LOGIN="${{ steps.marker_identity.outputs.login }}" python - <<'PY'
          import json, os
          pages = json.load(open("issue_comments.json", encoding="utf-8"))
          comments = [c for page in pages for c in page] if pages and isinstance(pages[0], list) else pages
          marker = os.environ["CLAIM_MARKER"]
          trusted = os.environ["TRUSTED_LOGIN"].casefold()
          matches = [
              c for c in comments
              if marker in (c.get("body") or "")
              and ((c.get("user") or {}).get("login") or "").casefold() == trusted
          ]
          print(matches[0]["id"] if matches else "")
          PY
          )
          if [ -z "$claim_id" ]; then
            claim_body=$(printf 'Cursor remediation round %s claimed for %s Codex finding(s). Agent id: %s\n\n%s' "$round" "$findings" "$agent_id" "$claim_marker")
            claim_id=$(GH_TOKEN="$GOAL_GITHUB_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$claim_body" --jq .id)
          else
            echo "Resuming trusted pending claim comment $claim_id for deterministic agent $agent_id."
          fi

          cleanup_claim() {
            GH_TOKEN="$GOAL_GITHUB_TOKEN" gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${claim_id}" >/dev/null 2>&1 || true
          }

          started=false
          for attempt in 1 2 3; do
            set +e
            http_code=$(curl -sS -u "${CURSOR_API_KEY}:" -H "Content-Type: application/json" --data @payload.json -o cursor_response.json -w '%{http_code}' https://api.cursor.com/v1/agents)
            curl_status=$?
            set -e

            if [ "$curl_status" -eq 0 ] && [[ "$http_code" =~ ^2 ]]; then
              python -c 'import json; r=json.load(open("cursor_response.json")); print(r["agent"]["id"])' > agent_id.txt
              python -c 'import json; r=json.load(open("cursor_response.json")); print(r["run"]["id"])' > run_id.txt
              python -c 'import json; r=json.load(open("cursor_response.json")); print(r["agent"]["url"])' > agent_url.txt
              started=true
              break
            fi

            if [ "$curl_status" -eq 0 ] && [ "$http_code" = "409" ]; then
              set +e
              lookup_code=$(curl -sS -u "${CURSOR_API_KEY}:" -o agent_lookup.json -w '%{http_code}' "https://api.cursor.com/v1/agents/${agent_id}")
              lookup_status=$?
              set -e
              if [ "$lookup_status" -eq 0 ] && [ "$lookup_code" = "200" ]; then
                python -c 'import json; r=json.load(open("agent_lookup.json")); print(r["id"])' > agent_id.txt
                python -c 'import json; r=json.load(open("agent_lookup.json")); print(r["latestRunId"])' > run_id.txt
                python -c 'import json; r=json.load(open("agent_lookup.json")); print(r["url"])' > agent_url.txt
                started=true
                break
              fi
            fi

            if [ "$curl_status" -eq 0 ] && [ "$http_code" -ge 400 ] && [ "$http_code" -lt 500 ] && [ "$http_code" != "409" ]; then
              echo "Cursor definitively rejected create request with HTTP $http_code."
              cat cursor_response.json || true
              cleanup_claim
              exit 1
            fi

            echo "Cursor create attempt $attempt had an ambiguous outcome (curl=$curl_status http=$http_code); retrying the same deterministic agent id."
            sleep 5
          done

          if [ "$started" != "true" ]; then
            # Final reconciliation: if the deterministic id exists, the remote
            # create succeeded despite an ambiguous transport response.
            for attempt in 1 2 3; do
              set +e
              lookup_code=$(curl -sS -u "${CURSOR_API_KEY}:" -o agent_lookup.json -w '%{http_code}' "https://api.cursor.com/v1/agents/${agent_id}")
              lookup_status=$?
              set -e
              if [ "$lookup_status" -eq 0 ] && [ "$lookup_code" = "200" ]; then
                python -c 'import json; r=json.load(open("agent_lookup.json")); print(r["id"])' > agent_id.txt
                python -c 'import json; r=json.load(open("agent_lookup.json")); print(r["latestRunId"])' > run_id.txt
                python -c 'import json; r=json.load(open("agent_lookup.json")); print(r["url"])' > agent_url.txt
                started=true
                break
              fi
              if [ "$lookup_status" -eq 0 ] && [ "$lookup_code" = "404" ]; then
                sleep 5
                continue
              fi
              echo "Cursor reconciliation remained ambiguous; preserving the claim to prevent duplicate agents."
              exit 1
            done
          fi

          if [ "$started" != "true" ]; then
            echo "Deterministic Cursor agent id was not created after retries."
            cleanup_claim
            exit 1
          fi

          url=$(cat agent_url.txt)
          started_body=$(printf 'Cursor remediation round %s started for %s Codex finding(s): %s\nAgent id: %s\n\n%s' "$round" "$findings" "$url" "$agent_id" "$marker")
          GH_TOKEN="$GOAL_GITHUB_TOKEN" gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${claim_id}" -f body="$started_body" >/dev/null

          echo "agent_id=$(cat agent_id.txt)" >> "$GITHUB_OUTPUT"
          echo "run_id=$(cat run_id.txt)" >> "$GITHUB_OUTPUT"

      - name: Wait for Cursor remediation
        id: wait_cursor
        if: steps.plan.outputs.action == 'launch' && steps.cursor.outcome == 'success'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          status=$(bash scripts/wait_for_cursor_agent.sh "$(cat agent_id.txt)" "$(cat run_id.txt)")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Cursor status: $status"

      - name: Stop if Cursor did not finish
        if: steps.plan.outputs.action == 'launch' && steps.wait_cursor.outputs.status != 'FINISHED'
        env:
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATUS: ${{ steps.wait_cursor.outputs.status }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Codex-to-Cursor automation stopped because the Cursor run ended with status ${STATUS}."
          exit 1

      - name: Verify Cursor moved only this pull request forward
        id: moved
        if: steps.plan.outputs.action == 'launch' && steps.wait_cursor.outputs.status == 'FINISHED'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          before=$(python -c 'import json; print(json.load(open("plan.json"))["head_sha"])')
          after=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          relation=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${before}...${after}" --jq .status)
          if [ "$relation" != "ahead" ]; then
            echo "Expected new head to descend from reviewed head; compare status was $relation."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Stop if Cursor made no commit
        if: steps.plan.outputs.action == 'launch' && steps.moved.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GOAL_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Codex-to-Cursor automation stopped because Cursor finished without moving the pull-request head."
          exit 1

